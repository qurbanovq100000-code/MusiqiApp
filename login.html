<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - MusiqiApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #121212; padding: 40px; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
        p { color: #b3b3b3; font-size: 14px; margin-bottom: 30px; }
        .google-btn { background: #ffffff; color: #000000; border: none; width: 100%; padding: 12px; border-radius: 30px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s; }
        .google-btn:hover { transform: scale(1.02); background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>MusiqiApp-ə Xoş Gəlmisiniz</h1>
        <p>Dinləməyə başlamaq üçün hesabınıza daxil olun</p>
        <button class="google-btn" onclick="window.location.href='/auth/google'">
            <span>🌐</span> Google ilə Daxil Ol
        </button>
    </div>
</body>
</html>
